name: Security
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.32'
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv export --quiet --locked --no-emit-project --format requirements-txt --output-file audit-requirements.txt
      - run: uv run pip-audit --requirement audit-requirements.txt --no-deps --disable-pip --format json --output dependency-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
  gate:
    name: Security
    if: always()
    needs: [dependencies, codeql]
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python -c 'import json,os; results=json.loads(os.environ["JOB_RESULTS"]); assert all(job["result"] == "success" for job in results.values()), results'
