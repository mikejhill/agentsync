name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag on main (for example v0.1.0)
        required: true
        type: string
      index:
        description: Package index
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}-${{ inputs.index || 'pypi' }}
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}
  security:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/security.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}
  build:
    needs: [ci, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.32'
          python-version: '3.12'
      - run: uv sync --locked
      - name: Verify version and main ancestry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          uv run python -m tests.repository_checks --tag "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
      - run: uv build
      - run: uv run poe package-check
      - run: uv run python -m tests.repository_checks --dist dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-distributions
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.index || 'pypi' }}
      url: ${{ inputs.index == 'testpypi' && 'https://test.pypi.org/p/agentsync-customizations' || 'https://pypi.org/p/agentsync-customizations' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require publisher registration
        env:
          PUBLISH_ENABLED: ${{ vars.PYPI_PUBLISH_ENABLED }}
        run: test "$PUBLISH_ENABLED" = true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-distributions
          path: dist
      - name: Publish to TestPyPI with attestations
        if: inputs.index == 'testpypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true
      - name: Publish to PyPI with attestations
        if: inputs.index != 'testpypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
  assets:
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-distributions
          path: dist
      - name: Attach published distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*
