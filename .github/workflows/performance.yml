name: Dedicated performance
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Repository-relative approved platform baseline JSON
        required: true
        type: string
permissions:
  contents: read
jobs:
  performance:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, agentsync-performance]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.32'
          python-version: '3.12'
      - run: uv sync --locked
      - name: Compare approved baseline
        env:
          AGENTSYNC_BASELINE: ${{ inputs.baseline }}
        shell: bash
        run: uv run python -m tests.quality_tools benchmark --baseline "$AGENTSYNC_BASELINE" --output performance.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: performance
          path: performance.json
